[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmo-analyzer"
version = "1.0.0"
description = "A utility to analyze AI-friendliness of web content"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.28.0",
    "groq>=0.4.0",
    "trafilatura>=1.6.0",
    "beautifulsoup4>=4.12.0",
    "textstat>=0.7.3",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "lxml>=4.9.3",
    "plotly>=5.18.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "tenacity>=8.2.0",
]

[project.scripts]
llmo-analyzer = "llmo_analyzer.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llmo_analyzer*"]
